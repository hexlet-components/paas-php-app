[tools]
"aqua:carthage-software/mago" = "latest"
betterleaks = "latest"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
osv-scanner = "latest"
php = "8.5"
pkl = "latest"
rumdl = "latest"
typos = "latest"

# Задачи проекта живут здесь, Makefile только проксирует make <задача> в mise run.
[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["composer install", "hk install"]

[tasks.test]
description = "Тесты HTTP-контракта приложения"
run = "composer exec phpunit"

[tasks.build]
description = "Собрать приложение, команда живёт в Makefile"
run = "make build"

[tasks.start]
description = "Собрать и запустить приложение, команда живёт в Makefile"
run = "make start"

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
