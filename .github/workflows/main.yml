name: CI

# Тесты стека через задачи mise. В самом шаблоне test заглушка, поэтому здесь
# job пропускается, а в репозитории из шаблона он красный до первой настройки
# (AGENTS.md). Линтеры стека идут шагами hk и запускаются в check.yml.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.repository != 'hexlet-components/component-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise собирает PHP из исходников, библиотеки для сборки ставятся из apt.
      # Список взят из README плагина mise-plugins/vfox-php. Готовую сборку
      # потом берёт кеш mise-action.
      - name: Install PHP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf bison re2c pkg-config \
            libxml2-dev libssl-dev libicu-dev libzip-dev libonig-dev \
            libcurl4-openssl-dev libpng-dev libjpeg-dev libfreetype6-dev \
            libwebp-dev libgmp-dev libsodium-dev libreadline-dev libbz2-dev

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - run: mise run setup
      - run: mise run test
