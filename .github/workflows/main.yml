name: CI

# Тесты стека через задачи mise. В самом шаблоне test заглушка, поэтому здесь
# job пропускается, а в репозитории из шаблона он красный до первой настройки
# (AGENTS.md). Линтеры стека идут шагами hk и запускаются в check.yml.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.repository != 'hexlet-components/component-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Тесты с базой идут против этого PostgreSQL. Без TEST_DATABASE_URL
    # они пропускаются, поэтому локально mise run test работает и без базы.
    services:
      postgres:
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        # Сервис живёт только на время job, вход без пароля.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise собирает PHP из исходников, библиотеки для сборки ставятся из apt.
      # Список взят из README плагина mise-plugins/vfox-php. Готовую сборку
      # потом берёт кеш mise-action. libpq-dev даёт pg_config, и с ним плагин
      # собирает драйвер pdo_pgsql.
      - name: Install PHP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf bison re2c pkg-config \
            libxml2-dev libssl-dev libicu-dev libzip-dev libonig-dev \
            libcurl4-openssl-dev libpng-dev libjpeg-dev libfreetype6-dev \
            libwebp-dev libgmp-dev libsodium-dev libreadline-dev libbz2-dev \
            libpq-dev

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Новый префикс сбрасывает кеш сборки PHP без pdo_pgsql.
          cache_key_prefix: mise-pgsql

      - run: mise run setup
      - run: mise run test
